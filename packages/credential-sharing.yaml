# Experimental: explicitly include this package in addition to common.yaml.
# Pairing codes are sent only to your device's API clients; do not expose via web_server.
external_components:
  - source:
      type: git
      url: https://github.com/wardmatter/esphome-otbr
      ref: epskc-prototype
    components: [thread_credential_sharing]
    refresh: always

openthread:
  core_options:
    OPENTHREAD_CONFIG_BORDER_AGENT_EPHEMERAL_KEY_ENABLE: "1"
    OPENTHREAD_CONFIG_VERHOEFF_CHECKSUM_ENABLE: "1"

logger:
  logs:
    text_sensor: WARN

thread_credential_sharing:
  id: thread_sharing
  pairing_code:
    name: Thread Sharing Pairing Code
  state:
    name: Thread Sharing State
  remaining:
    name: Thread Sharing Remaining

button:
  - platform: template
    name: Start Thread Credential Sharing
    entity_category: config
    on_press:
      - lambda: id(thread_sharing).start();
  - platform: template
    name: Stop Thread Credential Sharing
    entity_category: config
    on_press:
      - lambda: id(thread_sharing).stop();
