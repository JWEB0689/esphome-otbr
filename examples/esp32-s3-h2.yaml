# Verify your physical module's flash capacity before installing.
esphome:
  name: otbr-esp32-s3-h2
  friendly_name: OTBR esp32-s3-h2

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf
    log_level: INFO

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret otbr_api_key

ota:
  - platform: esphome
    password: !secret otbr_ota_password

openthread:
  border_router:
    rcp:
      rx_pin: GPIO17
      tx_pin: GPIO18
      reset_pin: GPIO7
      baud_rate: 460800

packages:
  diagnostics:
    url: https://github.com/wardmatter/esphome-otbr
    ref: main
    files: [packages/common.yaml]
    refresh: 1d
  # To enable the optional W5500 daughterboard, change files above to:
  # files: [packages/common.yaml, packages/ethernet.yaml]
